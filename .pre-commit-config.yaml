# Optional convenience hooks for contributors. The real gate is `nix flake
# check` — selftest, protocol-sync, formatting, statix and deadnix — plus CI's
# ruff, shellcheck and markdownlint. This config runs the non-Nix half locally so
# a broken commit fails before CI does.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Lint only. The board predates ruff and has its own formatting; running
      # `ruff-format` here would rewrite 14 of the 18 modules in a diff that has
      # nothing to do with the change being committed. Adopting the formatter is
      # a deliberate decision, not a side effect — until then this hook and CI's
      # `ruff check` are the same gate.
      - id: ruff-check
        args: [ --fix ]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [ --config, .markdownlint.json, --fix ]
